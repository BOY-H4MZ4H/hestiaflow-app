name: apply-autohapus-2026-10-22
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Terapkan patch
        run: node patch2.mjs
      - name: Cek sintaks
        run: node --check server.js
      - name: Commit, push, bersihkan alat tempel
        run: |
          git config user.name "hestia-sr"
          git config user.email "hestia.sri.rosee@gmail.com"
          git rm -q --ignore-unmatch patch2.mjs .github/workflows/apply-autohapus-2026-10-22.yml
          git add -A
          git commit -m "Auto-hapus akun panen habis/mati: failover hapus 401/402/403, 429 cooldown 6 jam + fail_count, sapuan cleanup 30 menit + expires_at akun"
          git push
