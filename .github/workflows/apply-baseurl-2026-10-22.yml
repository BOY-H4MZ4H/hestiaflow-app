name: apply-baseurl-2026-10-22
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Terapkan patch
        run: node patch3.mjs
      - name: Cek sintaks
        run: node --check public/app2.js
      - name: Commit, push, bersihkan alat tempel
        run: |
          git config user.name "hestia-sr"
          git config user.email "hestia.sri.rosee@gmail.com"
          git rm -q --ignore-unmatch patch3.mjs .github/workflows/apply-baseurl-2026-10-22.yml
          git add -A
          git commit -m "Contoh curl mengikuti baseUrl resmi dari settings (buang domain lama yang tertanam di app2.js)"
          git push
